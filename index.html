<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log meals in seconds by talking. Calorie and macro tracking built for athletes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://truecalorie.net" />
    <meta property="og:title" content="TrueCalorie" />
    <meta property="og:description" content="Log meals in seconds by talking. Calorie and macro tracking built for athletes." />
    <meta property="og:image" content="https://truecalorie.net/icon-512.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrueCalorie" />
    <meta name="twitter:description" content="Log meals in seconds by talking. Calorie and macro tracking built for athletes." />
    <meta name="twitter:image" content="https://truecalorie.net/icon-512.png" />
    <title>TrueCalorie</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <script>
      function showError(msg) {
        document.body.style.cssText = 'background:#fff;margin:0;padding:0;';
        document.body.innerHTML = '<div style="padding:16px;font-size:11px;color:red;font-family:monospace;word-break:break-all;white-space:pre-wrap;overflow-y:auto;height:100vh;">' + msg + '</div>';
      }
      window.onerror = function(msg, src, line, col, err) {
        showError('ERROR: ' + msg + '\n\nSource: ' + src + '\nLine: ' + line + '\n\n' + (err ? err.stack : ''));
      };
      window.addEventListener('unhandledrejection', function(e) {
        showError('UNHANDLED PROMISE:\n\n' + (e.reason ? e.reason.stack || e.reason.message || String(e.reason) : String(e)));
      });
    </script>
    <div id="root">
    <!-- Fallback content for crawlers and pre-JS render.
         React replaces this entirely when it mounts. -->
      <noscript>
        <p>TrueCalorie requires JavaScript. <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></p>
      </noscript>
     <footer aria-hidden="true" style="position: absolute; left: -9999px; top: -9999px;">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
      </footer>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
