<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Checkout canceled · TrueCalorie</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #14171c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon svg { display: block; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.55;
      margin: 0 0 10px;
      color: rgba(255, 255, 255, 0.72);
      max-width: 320px;
    }
    .hint {
      margin-top: 18px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.55);
      max-width: 320px;
    }
    .return-btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 28px;
      background: #1D9E75;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 7L17 17M17 7L7 17" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Checkout canceled</h1>
    <p>No charge was made. You can upgrade to Pro any time.</p>
    <a class="return-btn" href="truecalorie://">Return to TrueCalorie</a>
    <p class="hint">If nothing happens, switch back to the TrueCalorie app.</p>
  </div>
</body>
</html>
