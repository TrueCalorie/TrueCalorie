<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Payment complete · TrueCalorie</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #14171c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }
    .check {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(29, 158, 117, 0.12);
      border: 1px solid rgba(29, 158, 117, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .check svg { display: block; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.55;
      margin: 0 0 10px;
      color: rgba(255, 255, 255, 0.72);
      max-width: 320px;
    }
    .accent { color: #1D9E75; font-weight: 600; }
    .hint {
      margin-top: 18px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.55);
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="check">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12.5L10 17.5L19 7" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Payment complete</h1>
    <p>Your <span class="accent">Pro</span> features are now active.</p>
    <p class="hint">Tap Done at the top to return to TrueCalorie.</p>
  </div>
</body>
</html>
